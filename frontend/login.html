<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - EduPortal</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        EduPortal
      </a>
      <div class="ms-auto">
        <a href="signup.html" class="btn btn-outline-primary btn-sm px-3">
          <i class="bi bi-person-plus me-1"></i> Register as Student
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5 col-xl-4">
        
        <div class="card card-custom">
          <div class="card-header-custom text-center bg-white border-bottom py-4">
            <div class="stat-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Unified Login</h3>
            <p class="text-muted small mb-0">Sign in with your student or administrator account</p>
          </div>

          <div class="card-body p-4">
            <!-- Alert Feedback -->
            <div id="alertBox" class="alert d-none mb-4" role="alert"></div>

            <form id="loginForm" novalidate>
              
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                </div>
                <div class="invalid-feedback">Please enter your registered email.</div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="password" class="form-label mb-0">Password <span class="required">*</span></label>
                  <a href="forgot-password.html" class="small text-decoration-none fw-semibold">Forgot Password?</a>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                  <button class="btn btn-outline-secondary input-group-text cursor-pointer" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <!-- Login Submit Button -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                  <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                </button>
              </div>

            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <span class="text-muted small">New student? </span>
              <a href="signup.html" class="small fw-semibold text-decoration-none">Create an account</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 EduPortal. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
