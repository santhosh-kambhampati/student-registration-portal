<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EduPortal</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        EduPortal
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-primary btn-sm px-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5 col-xl-4">
        
        <div class="card card-custom">
          <div class="card-header-custom text-center bg-white border-bottom py-4">
            <div class="stat-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
              <i class="bi bi-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Set New Password</h3>
            <p class="text-muted small mb-0">Choose a new secure password for your account</p>
          </div>

          <div class="card-body p-4">
            <!-- Alert Feedback -->
            <div id="alertBox" class="alert d-none mb-4" role="alert"></div>

            <form id="resetForm" novalidate>
              
              <!-- New Password -->
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password <span class="required">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="At least 6 characters" minlength="6" required>
                  <button class="btn btn-outline-secondary input-group-text cursor-pointer" type="button" id="toggleNewPassword">
                    <i class="bi bi-eye" id="toggleNewPasswordIcon"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password <span class="required">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                  <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
                </div>
                <div class="invalid-feedback">Please confirm your password.</div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="submitSpinner" role="status" aria-hidden="true"></span>
                  <span id="submitBtnText"><i class="bi bi-check2-circle me-1"></i> Update Password</span>
                </button>
              </div>

            </form>

            <div id="successActionBox" class="text-center mt-4 d-none">
              <a href="login.html" class="btn btn-success w-100 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Login
              </a>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
              <a href="login.html" class="small fw-semibold text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 EduPortal. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
